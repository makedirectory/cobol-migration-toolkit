[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cobol-migration-toolkit"
version = "0.8.0"
description = "Inventory and dependency analysis for COBOL modernization"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Make Directory Developers, LLC", email = "andrew@mk-dir.com" }]
keywords = ["cobol", "mainframe", "modernization", "static-analysis", "dependency-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = []

[project.optional-dependencies]
# Linters are pinned so CI, pre-commit, and local runs agree (a formatter version
# bump silently reformats and breaks `ruff format --check`). Keep ruff in sync with
# .pre-commit-config.yaml when upgrading.
dev = ["pytest>=8,<9", "ruff==0.16.3", "mypy==1.11.2", "jsonschema>=4,<5"]

[project.urls]
Homepage = "https://github.com/makedirectory/cobol-migration-toolkit"
Issues = "https://github.com/makedirectory/cobol-migration-toolkit/issues"

[project.scripts]
cobol-migrate = "cobol_migrate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
